name: Validate pharmacy platform

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.yaml"
      - "**/*.yml"
      - "frontend/**"
      - ".github/workflows/validate.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.yaml"
      - "**/*.yml"
      - "frontend/**"
      - ".github/workflows/validate.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ruff==0.12.8 \
            coverage==7.10.2 \
            cfn-lint==1.39.1

      - name: Lint Python code
        run: ruff check .

      - name: Run unit tests with coverage
        run: |
          coverage run \
            --source=create_drug_lambda,get_drugs_lambda,process_low_stock_alert_lambda,process_low_stock_eventbridge_lambda \
            -m unittest discover \
            --pattern "test_*.py" \
            --verbose

          coverage report --show-missing

      - name: Validate SAM application template
        run: cfn-lint template.yaml

      - name: Validate pipeline template
        run: cfn-lint pipeline-template.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build